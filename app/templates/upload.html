<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document - VaultShare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #17365d;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 6px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #17365d;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Upload Document</h2>

    <p>Select a document to upload securely.</p>
    <p>Maximum file size: 10 MB.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">

        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="file" name="document" required>

        <button type="submit">Upload Document</button>

    </form>

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</div>

</body>
</html>
