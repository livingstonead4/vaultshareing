<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - VaultShare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 0;
        }

        header {
            background: #17365d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #17365d;
        }

        a.button {
            display: inline-block;
            background: #17365d;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
        }

        .logout {
            background: #b00020;
        }
    </style>
</head>

<body>

<header>
    <h1>VaultShare</h1>
    <p>Secure Document Sharing and Verification</p>
</header>

<div class="container">

    <div class="card">
        <h2>Welcome, {{ current_user.full_name }}!</h2>
        <p>You have successfully logged in to VaultShare.</p>
        <p><strong>Email:</strong> {{ current_user.email }}</p>
        <p><strong>Role:</strong> {{ current_user.role }}</p>
    </div>

    <div class="card">
        <h2>Document Management</h2>
        <p>Your document-sharing tools will appear here.</p>
    </div>

    <div class="card">
        <h2>Account</h2>
        <a class="button logout" href="{{ url_for('logout') }}">Log Out</a>
    </div>

</div>

</body>
</html>
